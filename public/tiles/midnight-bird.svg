<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" fill="#2C3E6B"/>
  <!-- Moon crescent -->
  <circle cx="60" cy="38" r="20" fill="#D4A843" opacity="0.35"/>
  <circle cx="66" cy="32" r="16" fill="#2C3E6B"/>
  <!-- Bird body -->
  <ellipse cx="50" cy="68" rx="22" ry="16" fill="none" stroke="#E8DFD0" stroke-width="2.5" transform="rotate(-10 50 68)"/>
  <!-- Wing -->
  <path d="M38 60 Q28 45 50 50 Q42 55 38 60Z" fill="#E8DFD0" opacity="0.4"/>
  <path d="M55 58 Q70 40 75 55 Q65 50 55 58Z" fill="#E8DFD0" opacity="0.3"/>
  <!-- Tail feathers -->
  <path d="M28 72 Q12 65 8 80" fill="none" stroke="#E8DFD0" stroke-width="2" opacity="0.6"/>
  <path d="M26 76 Q10 72 6 88" fill="none" stroke="#C4B99A" stroke-width="1.5" opacity="0.5"/>
  <path d="M28 80 Q14 80 10 95" fill="none" stroke="#E8DFD0" stroke-width="1.5" opacity="0.4"/>
  <!-- Head -->
  <circle cx="72" cy="60" r="8" fill="#E8DFD0" opacity="0.3"/>
  <!-- Eye -->
  <circle cx="74" cy="58" r="2.5" fill="#D4A843"/>
  <circle cx="74.5" cy="57.5" r="1" fill="#2C3E6B"/>
  <!-- Beak -->
  <path d="M80 60 L88 58 L82 63Z" fill="#C4724E" opacity="0.8"/>
  <!-- Branch/perch -->
  <line x1="30" y1="84" x2="90" y2="84" stroke="#8B6F4E" stroke-width="3" opacity="0.5"/>
  <line x1="85" y1="84" x2="95" y2="75" stroke="#4A7C59" stroke-width="2" opacity="0.5"/>
  <!-- Small leaves on branch -->
  <path d="M88 78 Q92 72 96 78" fill="#4A7C59" opacity="0.5"/>
  <path d="M90 80 Q95 75 98 82" fill="#4A7C59" opacity="0.4"/>
  <!-- Stars in sky -->
  <circle cx="20" cy="20" r="2" fill="#D4A843" opacity="0.6"/>
  <circle cx="95" cy="25" r="1.5" fill="#D4A843" opacity="0.5"/>
  <circle cx="100" cy="45" r="1" fill="#D4A843" opacity="0.4"/>
  <circle cx="15" cy="40" r="1.5" fill="#D4A843" opacity="0.4"/>
  <circle cx="40" cy="15" r="1" fill="#D4A843" opacity="0.5"/>
  <rect x="3" y="3" width="114" height="114" fill="none" stroke="#D4A843" stroke-width="4" rx="3"/>
</svg>
