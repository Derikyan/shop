<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" fill="#F0E4D2"/>
  <!-- Sunburst rays background -->
  <g opacity="0.12">
    <line x1="60" y1="0" x2="60" y2="120" stroke="#D4A843" stroke-width="3"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#D4A843" stroke-width="3"/>
    <line x1="10" y1="10" x2="110" y2="110" stroke="#D4A843" stroke-width="2"/>
    <line x1="110" y1="10" x2="10" y2="110" stroke="#D4A843" stroke-width="2"/>
  </g>
  <!-- Outer glow circle -->
  <circle cx="60" cy="60" r="38" fill="#D4A843" opacity="0.1"/>
  <!-- Main 8-point star -->
  <g transform="translate(60,60)">
    <polygon points="0,-35 10,-14 30,-14 16,0 22,24 0,14 -22,24 -16,0 -30,-14 -10,-14" fill="#D4A843"/>
    <polygon points="0,-25 7,-10 22,-10 12,0 16,18 0,10 -16,18 -12,0 -22,-10 -7,-10" fill="#E8C060"/>
    <polygon points="0,-15 4,-6 14,-6 8,0 10,11 0,6 -10,11 -8,0 -14,-6 -4,-6" fill="#F0D888"/>
  </g>
  <!-- Corner stars -->
  <g transform="translate(20,20) scale(0.35)">
    <polygon points="0,-28 6,-9 26,-9 10,3 16,22 0,12 -16,22 -10,3 -26,-9 -6,-9" fill="#D4A843" opacity="0.7"/>
  </g>
  <g transform="translate(100,20) scale(0.35)">
    <polygon points="0,-28 6,-9 26,-9 10,3 16,22 0,12 -16,22 -10,3 -26,-9 -6,-9" fill="#D4A843" opacity="0.7"/>
  </g>
  <g transform="translate(20,100) scale(0.35)">
    <polygon points="0,-28 6,-9 26,-9 10,3 16,22 0,12 -16,22 -10,3 -26,-9 -6,-9" fill="#D4A843" opacity="0.7"/>
  </g>
  <g transform="translate(100,100) scale(0.35)">
    <polygon points="0,-28 6,-9 26,-9 10,3 16,22 0,12 -16,22 -10,3 -26,-9 -6,-9" fill="#D4A843" opacity="0.7"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="60" cy="18" r="2.5" fill="#C49038"/>
  <circle cx="60" cy="102" r="2.5" fill="#C49038"/>
  <circle cx="18" cy="60" r="2.5" fill="#C49038"/>
  <circle cx="102" cy="60" r="2.5" fill="#C49038"/>
  <rect x="3" y="3" width="114" height="114" fill="none" stroke="#B8A88A" stroke-width="4" rx="3"/>
</svg>
